[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sec-edgar-mcp"
version = "0.1.0"
description = "Read-only MCP server over SEC EDGAR filings, XBRL facts and Form 4 trades, with provenance on every figure"
requires-python = ">=3.12"
dependencies = ["fastmcp>=3.4.10,<4", "httpx>=0.27", "defusedxml>=0.7"]

[project.scripts]
sec-edgar-mcp = "fin_sets.server:main"
sec-edgar-collect = "fin_sets.collect:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/fin_sets"]
